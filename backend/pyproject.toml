[project]
name = "openqms-backend"
version = "0.1.0"
description = "openQMS backend: FastAPI application, services, and database models."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "asyncpg>=0.30,<0.31",
    "aiosqlite>=0.20,<0.21",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt>=2.9,<3.0",
    "email-validator>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<1.14",
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<6.1",
    "httpx>=0.27,<0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires a real PostgreSQL instance (TEST_DATABASE_URL); see docs/Database.md#engines",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
